<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#ff5b39" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#fff7ec"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="14" fill="#d92d20"/>

  <!-- Bottom yellow stripe -->
  <rect x="0" y="600" width="1200" height="30" fill="#ffd23f"/>
  <rect x="0" y="595" width="1200" height="5" fill="#d92d20"/>

  <!-- Logo dot -->
  <circle cx="100" cy="120" r="14" fill="#d92d20"/>
  <text x="124" y="129" font-size="28" font-weight="700" fill="#1a1a1a">StupidAPIs.com</text>

  <!-- Tagline / main title -->
  <text x="100" y="270" font-size="78" font-weight="700" fill="#1a1a1a">APIs So Stupid</text>
  <text x="100" y="350" font-size="78" font-weight="700" fill="#d92d20">They Just Might Work</text>

  <!-- Subhead -->
  <text x="100" y="430" font-size="28" font-weight="400" fill="#444" font-style="italic">A public catalog of deliberately absurd APIs.</text>
  <text x="100" y="468" font-size="28" font-weight="400" fill="#444" font-style="italic">One new pack drops every day.</text>

  <!-- Hot dog mascot (text emoji workaround for SVG share images) -->
  <g transform="translate(940, 200)">
    <rect x="-30" y="-12" width="200" height="240" fill="#ffd23f" stroke="#1a1a1a" stroke-width="3" rx="8"/>
    <text x="70" y="80" font-size="64" text-anchor="middle">🌭</text>
    <text x="70" y="140" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">100 APIS</text>
    <text x="70" y="170" font-size="14" text-anchor="middle" fill="#444">REST · MCP · OpenClaw</text>
    <text x="70" y="200" font-size="14" text-anchor="middle" fill="#444">free tier · paid tiers</text>
  </g>

  <!-- Footer -->
  <text x="100" y="555" font-size="20" fill="#666">stupidapis.com  ·  api.stupidapis.com</text>
</svg>
